<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fırsat Panosu</title>

<style>
  :root {
    --bg-deep: #0B1220;
    --panel: #101A2E;
    --panel-raised: #16223A;
    --flap-amber: #FFB000;
    --flap-white: #EDEAE2;
    --muted: #6C7A93;
    --line: #243252;
    --burs: #7CD9A5;
    --staj: #5EA8FF;
    --yarisma: #FF6B6B;
    --program: #B794F4;
    --font-display: 'Space Mono', monospace;
    --font-body: 'IBM Plex Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-deep);
    color: var(--flap-white);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding-bottom: 80px;
  }
  a { color: inherit; }

  /* ---- Header ---- */
  header {
    padding: 48px 24px 32px;
    max-width: 960px;
    margin: 0 auto;
    text-align: center;
  }
  .eyebrow {
    font-family: var(--font-display);
    font-size: 12px;
    letter-spacing: 0.25em;
    color: var(--flap-amber);
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(32px, 7vw, 56px);
    letter-spacing: 0.02em;
    color: var(--flap-white);
    line-height: 1.1;
  }
  header p {
    margin-top: 14px;
    color: var(--muted);
    font-size: 15px;
    max-width: 440px;
    margin-left: auto;
    margin-right: auto;
  }

  /* ---- Next deadline strip ---- */
  .next-strip {
    max-width: 960px;
    margin: 0 auto 36px;
    padding: 0 24px;
  }
  .next-card {
    background: var(--panel-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 20px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .next-label {
    font-family: var(--font-display);
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .next-title {
    font-size: 17px;
    font-weight: 600;
    color: var(--flap-white);
  }
  .countdown {
    display: flex;
    gap: 8px;
  }
  .flap {
    background: var(--bg-deep);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 8px 12px;
    text-align: center;
    min-width: 56px;
    animation: flapIn 0.6s ease both;
  }
  .flap .num {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 24px;
    color: var(--flap-amber);
    display: block;
    line-height: 1;
  }
  .flap .unit {
    font-size: 9px;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
  }
  @keyframes flapIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---- Filters ---- */
  .filters {
    max-width: 960px;
    margin: 0 auto 20px;
    padding: 0 24px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
