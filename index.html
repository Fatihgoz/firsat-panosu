<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fırsat Panosu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0B1220;
    --panel: #101A2E;
    --panel-raised: #16223A;
    --flap-amber: #FFB000;
    --flap-white: #EDEAE2;
    --muted: #6C7A93;
    --line: #243252;
    --burs: #7CD9A5;
    --staj: #5EA8FF;
    --yarisma: #FF6B6B;
    --program: #B794F4;
    --font-display: 'Space Mono', monospace;
    --font-body: 'IBM Plex Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-deep);
    color: var(--flap-white);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding-bottom: 80px;
  }
  a { color: inherit; }

  header {
    padding: 48px 24px 32px;
    max-width: 960px;
    margin: 0 auto;
    text-align: center;
  }
  .eyebrow {
    font-family: var(--font-display);
    font-size: 12px;
    letter-spacing: 0.25em;
    color: var(--flap-amber);
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(32px, 7vw, 56px);
    letter-spacing: 0.02em;
    color: var(--flap-white);
    line-height: 1.1;
  }
  header p {
    margin-top: 14px;
    color: var(--muted);
    font-size: 15px;
    max-width: 440px;
    margin-left: auto;
    margin-right: auto;
  }

  .next-strip {
    max-width: 960px;
    margin: 0 auto 36px;
    padding: 0 24px;
  }
  .next-card {
    background: var(--panel-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 20px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .next-label {
    font-family: var(--font-display);
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .next-title {
    font-size: 17px;
    font-weight: 600;
    color: var(--flap-white);
  }
  .countdown {
    display: flex;
    gap: 8px;
  }
  .flap {
    background: var(--bg-deep);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 8px 12px;
    text-align: center;
    min-width: 56px;
    animation: flapIn 0.6s ease both;
  }
  .flap .num {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 24px;
    color: var(--flap-amber);
    display: block;
    line-height: 1;
  }
  .flap .unit {
    font-size: 9px;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
  }
  @keyframes flapIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .filters {
    max-width: 960px;
    margin: 0 auto 20px;
    padding: 0 24px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-btn {
    font-family: var(--font-display);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 9px 16px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .filter-btn:hover { color: var(--flap-white); border-color: var(--muted); }
  .filter-btn.active {
    background: var(--flap-amber);
    color: var(--bg-deep);
    border-color: var(--flap-amber);
  }

  .board {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 24px;
  }
  .board-header {
    display: grid;
    grid-template-columns: 100px 1fr 130px 90px;
    gap: 12px;
    font-family: var(--font-display);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
  }
  .row {
    display: grid;
    grid-template-columns: 100px 1fr 130px 90px;
    gap: 12px;
    align-items: center;
    padding: 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    animation: rowIn 0.5s ease both;
    transition: background 0.15s ease;
  }
  .row:hover { background: var(--panel-raised); }
  @keyframes rowIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .tag {
    font-family: var(--font-display);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 8px;
    border-radius: 3px;
    display: inline-block;
    width: fit-content;
  }
  .tag.burs { background: rgba(124,217,165,0.15); color: var(--burs); }
  .tag.staj { background: rgba(94,168,255,0.15); color: var(--staj); }
  .tag.yarisma { background: rgba(255,107,107,0.15); color: var(--yarisma); }
  .tag.program { background: rgba(183,148,244,0.15); color: var(--program); }

  .row-title { font-size: 14px; font-weight: 600; color: var(--flap-white); }
  .row-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .row-date { font-family: var(--font-display); font-size: 13px; color: var(--flap-white); }
  .row-remain { font-family: var(--font-display); font-size: 12px; color: var(--flap-amber); text-align: right; }

  @media (max-width: 640px) {
    .board-header { display: none; }
    .row {
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .row-remain { text-align: left; }
    .next-card { flex-direction: column; align-items: flex-start; }
  }

  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(5,8,16,0.75);
    z-index: 50;
    padding: 24px;
    overflow-y: auto;
  }
  .modal-backdrop.open { display: block; }
  .modal {
    max-width: 720px;
    margin: 24px auto 60px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 32px;
    animation: rowIn 0.25s ease both;
  }
  .modal-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 8px;
  }
  .modal-close {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 4px;
    width: 32px; height: 32px;
    cursor: pointer;
    font-family: var(--font-display);
    flex-shrink: 0;
  }
  .modal-close:hover { color: var(--flap-white); border-color: var(--muted); }
  .modal h2 {
    font-family: var(--font-display);
    font-size: 22px;
    color: var(--flap-white);
    line-height: 1.3;
  }
  .modal-meta {
    font-family: var(--font-display);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-transform: uppercase;
    margin: 6px 0 20px;
  }
  .modal-section { margin-bottom: 24px; }
  .modal-section h3 {
    font-family: var(--font-display);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--flap-amber);
    margin-bottom: 10px;
  }
  .modal-section p { font-size: 14px; color: var(--flap-white); line-height: 1.6; }
  .modal-list { list-style: none; }
  .modal-list li {
    font-size: 13px;
    color: var(--flap-white);
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    line-height: 1.5;
  }
  .modal-list li:last-child { border-bottom: none; }
  .modal-list .li-title { font-weight: 600; margin-bottom: 2px; }
  .timeline-item {
    display: grid;
    grid-template-columns: 110px 1fr;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .timeline-item:last-child { border-bottom: none; }
  .timeline-date {
    font-family: var(--font-display);
    font-size: 11px;
    color: var(--flap-amber);
  }
  .timeline-label { font-size: 13px; color: var(--flap-white); font-weight: 600; }
  .timeline-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .modal-cta {
    display: inline-block;
    margin-top: 8px;
    font-family: var(--font-display);
    font-size: 13px;
    letter-spacing: 0.05em;
    background: var(--flap-amber);
    color: var(--bg-deep);
    text-decoration: none;
    padding: 12px 20px;
    border-radius: 4px;
    font-weight: 700;
  }

  footer {
    max-width: 960px;
    margin: 56px auto 0;
    padding: 24px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    font-family: var(--font-display);
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Ahmet Fatih Göz sunar</div>
  <h1>FIRSAT PANOSU</h1>
  <p>Burs, staj, yarışma ve zirve başvurularını tek panoda topladım. Kaçırma.</p>
</header>

<div class="next-strip">
  <div class="next-card">
    <div>
      <div class="next-label">En Yakın Son Tarih</div>
      <div class="next-title" id="next-title">—</div>
    </div>
    <div class="countdown" id="countdown"></div>
  </div>
</div>

<div class="filters" id="filters"></div>

<div class="board">
  <div class="board-header">
    <div>Kategori</div>
    <div>Fırsat</div>
    <div>Son Tarih</div>
    <div style="text-align:right">Kalan</div>
  </div>
  <div id="rows"></div>
</div>

<footer>PANO SON GÜNCELLEME: <span id="updated"></span></footer>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" id="modal-content"></div>
</div>

<script>
  const DATA = [
    {
      cat: "program",
      title: "Breaking Barriers: Dreamers to Doers Zirvesi",
      desc: "Boğaziçi Üniversitesi Güney Kampüs'te gerçekleşecek, girişimcilik dünyasının başarılı isimlerini ağırlayan ücretsiz ve sertifikalı zirve.",
      date: "2026-10-23",
      link: "https://docs.google.com/forms/d/e/1FAIpQLSegT1-F0NAYRLl-q8k5aVvIoGGvq5ah3oYh3fqap1aZxG_aKA/viewform",
      meta: "23 Ekim Cuma (10:00 - 17:00) · Boğaziçi Üniversitesi · Ücretsiz & Sertifikalı",
      summary: "Girişimcilik ekosisteminin önde gelen isimlerini bir araya getiren bu zirve; ilham verici hikayeler dinlemek, yeni fikirler keşfetmek ve girişimcilik dünyasına dair vizyon edinmek isteyen tüm üniversite öğrencilerine açıktır.",
      criteria: [
        "Tüm üniversite öğrencilerine ve girişimcilik ekosistemine ilgi duyan gençlere açıktır.",
        "Etkinlik tamamen ücretsizdir.",
        "Katılımcılara resmi katılım sertifikası verilecektir."
      ],
      odul: "Resmi katılım sertifikası ve ekosistem liderleriyle doğrudan networking fırsatı.",
      note: "Etkinlik Yeri: Boğaziçi Üniversitesi Güney Kampüs, Natuk Birkan Binası, İbrahim Bodur Oditoryumu."
    },
    {
      cat: "program",
      title: "CaseCampus Bootcamp Live",
      desc: "Akbank iş ortaklığında Endeavor Türkiye’nin hayata geçirdiği; 70 gence özel, tamamen ücretsiz online girişimcilik ve hızlandırma kampı.",
      date: "2026-11-06",
      link: "https://www.casecampus.org",
      meta: "25–28 Kasım 2026 · Online · 70 Kişilik Kontenjan",
      summary: "CaseCampus Programı, girişimciliğe ilgi duyan gençleri başarılı girişimciler, akademisyenler, yatırımcılar ve uzmanlarla bir araya getiren özgün bir gelişim programıdır. 70 katılımcıyla 4 gün boyunca online olarak gerçekleşir.",
      criteria: [
        "Üniversite lisans veya lisansüstü öğrencisi olmak.",
        "Girişimcilik konularına ilgi duymak veya kendi girişimini kurma yolunda ilerlemek.",
        "25-28 Kasım tarihlerindeki 4 günlük online atölye ve çalışmalara eksiksiz katılım sağlayabilmek."
      ],
      odul: "Tamamen ücretsiz eğitim, MVP ve iş modeli atölyeleri, başarılı girişimcilerle Round Table oturumları ve güçlü ekosistem networking ağı.",
      note: "Son başvuru tarihi 6 Kasım 2026 Cuma günüdür. Program tamamen ücretsizdir."
    },
    {
      cat: "program",
      title: "Business Strategy Summit (BSS'26)",
      desc: "Türkiye’nin ilk ve en büyük Strateji ve İş Geliştirme zirvesi; yönetim danışmanlığı ve strateji devleri Boğaziçi Üniversitesi'nde buluşuyor.",
      date: "2026-11-20",
      link: "https://docs.google.com/forms/d/e/1FAIpQLSefIoINTD26Oc8gZtWJBhVBrUnt71LEmMz4V3sEepl8zBZmhA/viewform",
      meta: "28–29 Kasım 2026 · Boğaziçi Üniversitesi · BÜYAK",
      summary: "Boğaziçi Üniversitesi Yöneylem Araştırması Kulübü (BÜYAK) tarafından düzenlenen zirve; yüzlerce öğrenciyi strateji, yönetim danışmanlığı ve iş geliştirme alanlarında önde gelen şirketlerle buluşturur. Sektörleri yakından tanıma, güncel trendleri keşfetme ve güçlü bir networking ağı oluşturma fırsatı sunar.",
      criteria: [
        "Üniversite öğrencilerine açıktır.",
        "Strateji, yönetim danışmanlığı ve iş geliştirme alanlarına ilgi duyan adaylar başvurabilir.",
        "28-29 Kasım 2026 tarihlerinde Boğaziçi Üniversitesi'ndeki oturumlara katılım sağlanmalıdır."
      ],
      odul: "Üst düzey yöneticiler ve şirket liderleriyle doğrudan networking, yönetim danışmanlığı vaka analizleri ve sektörel yetkinlik kazanımları.",
      note: "Zirve fiziksel olarak Boğaziçi Üniversitesi'nde gerçekleşecektir."
    }
  ];

  const CAT_LABEL = { burs: "Burs", staj: "Staj", yarisma: "Yarışma", program: "Program" };
  const FILTERS = [
    { key: "all", label: "Tümü" },
    { key: "burs", label: "Burslar" },
    { key: "staj", label: "Stajlar" },
    { key: "yarisma", label: "Yarışmalar" },
    { key: "program", label: "Programlar" }
  ];

  let activeFilter = "all";

  function daysRemaining(dateStr) {
    if (!dateStr) return -999;
    const parts = dateStr.split('-');
    const target = new Date(parts[0], parts[1] - 1, parts[2]);
    const now = new Date();
    const nowMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const diff = Math.round((target - nowMidnight) / (1000 * 60 * 60 * 24));
    return diff;
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    const parts = dateStr.split('-');
    const d = new Date(parts[0], parts[1] - 1, parts[2]);
    return d.toLocaleDateString('tr-TR', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  function renderFilters() {
    const el = document.getElementById('filters');
    if (!el) return;
    el.innerHTML = FILTERS.map(f =>
      `<button class="filter-btn ${f.key === activeFilter ? 'active' : ''}" data-key="${f.key}">${f.label}</button>`
    ).join('');
    el.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        activeFilter = btn.dataset.key;
        renderFilters();
        renderRows();
      });
    });
  }

  function renderRows() {
    const sorted = [...DATA].sort((a, b) => new Date(a.date) - new Date(b.date));
    const filtered = activeFilter === "all" ? sorted : sorted.filter(d => d.cat === activeFilter);
    const el = document.getElementById('rows');
    if (!el) return;

    if (filtered.length === 0) {
      el.innerHTML = `<div style="padding:32px; text-align:center; color:var(--muted); font-family:var(--font-display); font-size:13px;">BU KATEGORİDE ŞU AN KAYIT YOK</div>`;
      return;
    }

    el.innerHTML = filtered.map((d, i) => {
      const remain = daysRemaining(d.date);
      const remainText = remain < 0 ? "Süresi geçti" : remain === 0 ? "Bugün Son Gün" : `${remain} gün`;
      const realIndex = DATA.indexOf(d);
      return `
        <div class="row" style="animation-delay:${i * 0.03}s; cursor:pointer;" data-idx="${realIndex}" role="button" tabindex="0">
          <span class="tag ${d.cat}">${CAT_LABEL[d.cat] || d.cat}</span>
          <div>
            <div class="row-title">${d.title} <span style="color:var(--flap-amber); font-size:11px;">→ Detay</span></div>
            <div class="row-desc">${d.desc}</div>
          </div>
          <div class="row-date">${formatDate(d.date)}</div>
          <div class="row-remain">${remainText}</div>
        </div>`;
    }).join('');

    el.querySelectorAll('.row[data-idx]').forEach(row => {
      row.addEventListener('click', () => openModal(parseInt(row.dataset.idx, 10)));
      row.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          openModal(parseInt(row.dataset.idx, 10));
        }
      });
    });
  }

  function openModal(idx) {
    const d = DATA[idx];
    if (!d) return;
    const backdrop = document.getElementById('modal-backdrop');
    const content = document.getElementById('modal-content');
    if (!backdrop || !content) return;

    let html = `
      <div class="modal-top">
        <div>
          <h2>${d.title}</h2>
          <div class="modal-meta">${d.meta || ''}</div>
        </div>
        <button class="modal-close" id="modal-close-btn" type="button">✕</button>
      </div>
      <div class="modal-section"><p>${d.summary || d.desc}</p></div>
    `;

    if (d.criteria && d.criteria.length) {
      html += `<div class="modal-section"><h3>Başvuru & Katılım Koşulları</h3><ul class="modal-list">`;
      html += d.criteria.map(c => `<li>${c}</li>`).join('');
      html += `</ul></div>`;
    }

    if (d.odul) {
      html += `<div class="modal-section"><h3>Kazanımlar / Ödüller</h3><p>${d.odul}</p></div>`;
    }

    if (d.note) {
      html += `<div class="modal-section" style="border-left:2px solid var(--program); padding-left:14px;"><p style="color:var(--muted); font-size:13px;">${d.note}</p></div>`;
    }

    if (d.link && d.link !== "#") {
      html += `<a class="modal-cta" href="${d.link}" target="_blank" rel="noopener">Hemen Başvur / İncele →</a>`;
    }

    content.innerHTML = html;
    backdrop.classList.add('open');

    const closeBtn = document.getElementById('modal-close-btn');
    if (closeBtn) closeBtn.addEventListener('click', closeModal);
  }

  function closeModal() {
    const backdrop = document.getElementById('modal-backdrop');
    if (backdrop) backdrop.classList.remove('open');
  }

  document.addEventListener('DOMContentLoaded', () => {
    const backdrop = document.getElementById('modal-backdrop');
    if (backdrop) {
      backdrop.addEventListener('click', (e) => {
        if (e.target.id === 'modal-backdrop') closeModal();
      });
    }

    function renderNext() {
      const activeItems = DATA
        .filter(d => daysRemaining(d.date) >= 0)
        .sort((a, b) => new Date(a.date) - new Date(b.date));

      const next = activeItems[0];
      const titleEl = document.getElementById('next-title');
      const countEl = document.getElementById('countdown');

      if (!next) {
        if (titleEl) titleEl.textContent = "Yaklaşan aktif başvuru yok";
        if (countEl) countEl.innerHTML = "";
        return;
      }

      if (titleEl) titleEl.textContent = next.title;
      const remain = daysRemaining(next.date);
      const days = Math.max(remain, 0);
      if (countEl) {
        countEl.innerHTML = `
          <div class="flap"><span class="num">${String(days).padStart(2, '0')}</span><span class="unit">Gün</span></div>
        `;
      }
    }

    renderFilters();
    renderRows();
    renderNext();

    const updatedEl = document.getElementById('updated');
    if (updatedEl) {
      updatedEl.textContent = new Date().toLocaleDateString('tr-TR', { day: '2-digit', month: 'long', year: 'numeric' });
    }
  });
</script>

</body>
</html>
